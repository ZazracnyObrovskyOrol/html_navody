<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Návody</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Návody</h1>
  <p class="lead">Prehľad návodov v tomto adresári. Zoznam sa vytvára automaticky zo všetkých HTML súborov.</p>
  <div class="cards" id="zoznam">
    <p class="muted">Načítavam…</p>
  </div>
</main>
<script>
(function () {
  var box = document.getElementById("zoznam");

  function karta(n) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = encodeURI(n.subor);
    var s = document.createElement("strong");
    s.textContent = n.nadpis;
    a.appendChild(s);
    var span = document.createElement("span");
    span.textContent = n.popis || n.subor;
    a.appendChild(span);
    return a;
  }

  fetch("zoznam.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      box.textContent = "";
      if (!data.length) {
        box.innerHTML = "<p>V adresári zatiaľ nie sú žiadne návody.</p>";
        return;
      }
      data.forEach(function (n) { box.appendChild(karta(n)); });
    })
    .catch(function () {
      box.innerHTML = '<div class="note">Zoznam návodov sa nepodarilo načítať. ' +
        'Stránku otvorte cez server spustený príkazom <code>./spusti_server.sh</code>.</div>';
    });
})();
</script>
</body>
</html>
